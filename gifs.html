<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>gifs~!!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#09090f;color:#f0eef8;font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-200px;left:-150px;width:500px;height:500px;background:radial-gradient(circle,rgba(244,114,182,.07) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(192,132,252,.06) 0%,transparent 70%);pointer-events:none;z-index:0}
.page{max-width:760px;margin:0 auto;padding:3rem 1.5rem 6rem;position:relative;z-index:1}
h1{font-size:2.4rem;font-weight:600;letter-spacing:-0.05em;background:linear-gradient(120deg,#f9a8d4,#f472b6,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block;transform:rotate(-1deg);transform-origin:left;margin-bottom:.15rem}
.sub{color:#7a7890;font-size:.86rem;margin-bottom:2rem;padding-left:2px}
.drop{border:1.5px dashed rgba(244,114,182,.4);border-radius:16px;background:#111118;padding:2.5rem 1.5rem;display:flex;flex-direction:column;align-items:center;gap:.55rem;cursor:pointer;transition:all .2s;text-align:center;position:relative}
.drop:hover,.drop.over{border-color:#f472b6;background:rgba(244,114,182,.04)}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop svg{opacity:.6;margin-bottom:.1rem}
.drop-title{font-size:.95rem;font-weight:500}
.drop-sub{font-size:.78rem;color:#7a7890;line-height:1.6}
.pills{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin-top:.35rem}
.pill{font-size:.68rem;font-family:'DM Mono',monospace;background:#1a1a24;border:1px solid rgba(244,114,182,.12);border-radius:99px;padding:2px 8px;color:#7a7890}
.url-row{display:flex;gap:.6rem;margin-top:.9rem}
.url-row input{flex:1;background:#111118;border:1px solid rgba(244,114,182,.12);border-radius:9px;padding:.58rem .85rem;color:#f0eef8;font-family:'DM Sans',sans-serif;font-size:.86rem;outline:none;transition:border .2s}
.url-row input:focus{border-color:#f472b6}
.url-row input::placeholder{color:#7a7890}
.btn{background:#f472b6;color:#fff;border:none;border-radius:9px;padding:.58rem 1.1rem;font-family:'DM Sans',sans-serif;font-size:.86rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.btn:hover{background:#be185d}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.prog-wrap{margin-top:1.1rem;display:none}
.prog-label{font-size:.76rem;color:#7a7890;margin-bottom:.38rem}
.prog-bar{height:3px;background:#1a1a24;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:#f472b6;border-radius:99px;width:0%;transition:width .3s}
.err{margin-top:.8rem;background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.25);border-radius:9px;padding:.6rem .85rem;font-size:.8rem;color:#fca5a5;display:none}
.gallery{margin-top:2.75rem}
.g-head{font-size:.74rem;font-weight:500;color:#7a7890;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:.7rem}
.empty{color:#7a7890;font-size:.86rem;padding:.5rem 0}
.card{background:#111118;border:1px solid rgba(244,114,182,.12);border-radius:12px;overflow:hidden;transition:border .18s}
.card:hover{border-color:rgba(244,114,182,.35)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#000}
.card-foot{padding:.55rem .7rem;display:flex;align-items:center;gap:.45rem}
.card-name{flex:1;font-size:.68rem;font-family:'DM Mono',monospace;color:#7a7890;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.copy-btn{background:#1a1a24;border:1px solid rgba(244,114,182,.35);color:#f0eef8;border-radius:6px;padding:.28rem .6rem;font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.copy-btn:hover{border-color:#f472b6;color:#f472b6}
.copy-btn.ok{background:rgba(244,114,182,.13);color:#f472b6;border-color:#f472b6}
</style>
</head>
<body>
<div class="page">
<h1>gifs~!!</h1>
<p class="sub">drop anything · get a discord-ready link forever~</p>
<div class="drop" id="drop">
<input type="file" id="file-input" accept="image/*,video/*"/>
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V8m0 0-3 3m3-3 3 3"/><path d="M6.5 19A4.5 4.5 0 0 1 5 10.5a5 5 0 0 1 9.9-1A3.5 3.5 0 0 1 18.5 13"/></svg>
<div class="drop-title">drop a file or click to browse</div>
<div class="drop-sub">images → still gif &nbsp;·&nbsp; videos → animated gif<br>all uploads live forever with a shareable link</div>
<div class="pills"><span class="pill">.gif</span><span class="pill">.png</span><span class="pill">.jpg</span><span class="pill">.webp</span><span class="pill">.mp4</span><span class="pill">.webm</span><span class="pill">.mov</span></div>
</div>
<div class="url-row">
<input type="text" id="url-input" placeholder="or paste a video / gif URL…"/>
<button class="btn" id="url-btn">fetch &amp; upload</button>
</div>
<div class="prog-wrap" id="prog-wrap"><div class="prog-label" id="prog-label">processing…</div><div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div></div>
<div class="err" id="err"></div>
<div class="gallery"><div class="g-head">uploaded gifs</div><div class="grid" id="grid"><div class="empty" id="empty">nothing yet — upload something~</div></div></div>
</div>
<script>
const SUPABASE_URL='https://mwqjyivvelpiwqnpjhjj.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13cWp5aXZ2ZWxwaXdxbnBqaGpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMjUwMTYsImV4cCI6MjA5MjkwMTAxNn0.moa-xNBfC_5_D7kB4qoqLMQcbsn-9VWDBojXz1cPAiw';
const BUCKET='gifs';
const drop=document.getElementById('drop'),fileInput=document.getElementById('file-input'),urlInput=document.getElementById('url-input'),urlBtn=document.getElementById('url-btn'),progWrap=document.getElementById('prog-wrap'),progLabel=document.getElementById('prog-label'),progFill=document.getElementById('prog-fill'),errBox=document.getElementById('err'),grid=document.getElementById('grid');
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files[0];if(f)handleFile(f)});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])handleFile(fileInput.files[0]);fileInput.value=''});
urlBtn.addEventListener('click',()=>{const u=urlInput.value.trim();if(u)handleUrl(u)});
urlInput.addEventListener('keydown',e=>{if(e.key==='Enter'){const u=urlInput.value.trim();if(u)handleUrl(u)}});
function setProgress(pct,label){progWrap.style.display='block';progLabel.textContent=label||'processing…';progFill.style.width=pct+'%'}
function hideProgress(){progWrap.style.display='none';progFill.style.width='0%'}
function showErr(msg){errBox.style.display='block';errBox.textContent=msg}
function hideErr(){errBox.style.display='none'}

function encodeGif(frames,w,h,delay){
  const b=[];
  const wb=(n)=>{b.push(n&255)};
  const ws=(n)=>{wb(n&255);wb((n>>8)&255)};
  const wstr=(s)=>{for(let i=0;i<s.length;i++)wb(s.charCodeAt(i))};
  function quantize(data){
    const pal=[[0,0,0]];const map={};const idx=new Uint8Array(w*h);
    for(let i=0;i<data.length;i+=4){
      const r=data[i]&0xF8,g=data[i+1]&0xF8,bl=data[i+2]&0xF8;
      const k=(r<<16)|(g<<8)|bl;
      if(map[k]===undefined){if(pal.length<256){map[k]=pal.length;pal.push([data[i],data[i+1],data[i+2]])}else{map[k]=0}}
      idx[i>>2]=map[k]
    }
    while(pal.length<256)pal.push([0,0,0]);
    return{pal,idx}
  }
  function lzw(idx,minBits){
    const cc=1<<minBits,eoi=cc+1;let nc=eoi+1,cs=minBits+1;
    const out=[];let cur=0,nb=0;
    function flush(v,bits){cur|=v<<nb;nb+=bits;while(nb>=8){out.push(cur&255);cur>>>=8;nb-=8}}
    const tab=new Map();for(let i=0;i<cc;i++)tab.set(String(i),i);
    flush(cc,cs);
    let buf=String(idx[0]);
    for(let i=1;i<idx.length;i++){
      const c=String(idx[i]),nxt=buf+','+c;
      if(tab.has(nxt)){buf=nxt}
      else{
        flush(tab.get(buf),cs);
        if(nc<4096){tab.set(nxt,nc++);if(nc>(1<<cs)&&cs<12)cs++}
        else{flush(cc,cs);cs=minBits+1;nc=eoi+1;tab.clear();for(let j=0;j<cc;j++)tab.set(String(j),j)}
        buf=c
      }
    }
    flush(tab.get(buf),cs);flush(eoi,cs);if(nb>0)out.push(cur&255);
    return out
  }
  wstr('GIF89a');ws(w);ws(h);wb(0xF7);wb(0);wb(0);
  const {pal:pal0,idx:idx0}=quantize(frames[0].data);
  for(let i=0;i<256;i++){wb(pal0[i][0]);wb(pal0[i][1]);wb(pal0[i][2])}
  wb(0x21);wb(0xFF);wb(11);wstr('NETSCAPE2.0');wb(3);wb(1);ws(0);wb(0);
  for(let fi=0;fi<frames.length;fi++){
    const {pal,idx}=fi===0?{pal:pal0,idx:idx0}:quantize(frames[fi].data);
    wb(0x21);wb(0xF9);wb(4);wb(0);ws(Math.round(delay/10));wb(0);wb(0);
    wb(0x2C);ws(0);ws(0);ws(w);ws(h);wb(0x80|7);
    for(let i=0;i<256;i++){wb(pal[i][0]);wb(pal[i][1]);wb(pal[i][2])}
    const lzwData=lzw(idx,8);wb(8);
    for(let i=0;i<lzwData.length;i+=255){const chunk=lzwData.slice(i,i+255);wb(chunk.length);for(let j=0;j<chunk.length;j++)wb(chunk[j])}
    wb(0)
  }
  wb(0x3B);
  return new Uint8Array(b)
}

function loadImg(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file);
    const i=new Image();
    i.onload=()=>{URL.revokeObjectURL(u);res(i)};
    i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('could not load image'))};
    i.src=u
  })
}
function scaleDims(w,h,max){const s=Math.min(1,max/Math.max(w,h));return[Math.round(w*s)||1,Math.round(h*s)||1]}
function canvasFrame(img,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);return c.getContext('2d').getImageData(0,0,w,h)}

async function imageToGif(file){
  try{
    setProgress(30,'loading image…');
    const img=await loadImg(file);
    const[w,h]=scaleDims(img.naturalWidth,img.naturalHeight,480);
    setProgress(55,'encoding gif…');
    await new Promise(r=>setTimeout(r,20));
    const frame=canvasFrame(img,w,h);
    const gifBytes=encodeGif([frame],w,h,100);
    setProgress(80,'uploading…');
    await uploadGifBlob(new Blob([gifBytes],{type:'image/gif'}),file.name.replace(/\.[^.]+$/,'')+'.gif')
  }catch(e){hideProgress();showErr('failed: '+e.message)}
}

async function videoToGif(file){
  return new Promise(resolve=>{
    const objUrl=URL.createObjectURL(file);
    const video=document.createElement('video');
    video.src=objUrl;video.muted=true;video.preload='metadata';
    video.addEventListener('loadedmetadata',async()=>{
      const dur=Math.min(video.duration||5,8);
      const fps=6,total=Math.min(Math.floor(dur*fps),48);
      const[w,h]=scaleDims(video.videoWidth||480,video.videoHeight||270,360);
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      const frames=[];
      for(let i=0;i<total;i++){
        video.currentTime=(i/total)*dur;
        await new Promise(r=>video.addEventListener('seeked',r,{once:true}));
        ctx.drawImage(video,0,0,w,h);
        frames.push(ctx.getImageData(0,0,w,h));
        setProgress(10+Math.round((i/total)*60),'capturing frame '+(i+1)+'/'+total+'…')
      }
      URL.revokeObjectURL(objUrl);
      setProgress(72,'encoding gif…');
      await new Promise(r=>setTimeout(r,20));
      const gifBytes=encodeGif(frames,w,h,Math.round(1000/fps));
      setProgress(88,'uploading…');
      await uploadGifBlob(new Blob([gifBytes],{type:'image/gif'}),file.name.replace(/\.[^.]+$/,'')+'.gif');
      resolve()
    });
    video.load()
  })
}

async function handleFile(file){
  hideErr();
  const t=file.type;
  if(t==='image/gif'){setProgress(30,'uploading gif…');const buf=await file.arrayBuffer();await uploadGifBlob(new Blob([buf],{type:'image/gif'}),file.name)}
  else if(t.startsWith('image/')){await imageToGif(file)}
  else if(t.startsWith('video/')){await videoToGif(file)}
  else showErr('unsupported file type — try an image or video~')
}
async function handleUrl(url){
  hideErr();urlInput.value='';setProgress(10,'fetching url…');
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),10000);
  try{
    const res=await fetch(url,{signal:ctrl.signal});clearTimeout(t);
    if(!res.ok)throw new Error('status '+res.status);
    const blob=await res.blob();
    const name=url.split('/').pop().split('?')[0]||'upload';
    await handleFile(new File([blob],name,{type:blob.type}))
  }catch(e){clearTimeout(t);hideProgress();if(e.name==='AbortError')showErr('timed out — url might block cross-origin. download and upload directly~');else showErr('fetch failed: '+e.message)}
}
async function uploadGifBlob(blob,filename){
  const name=Date.now()+'_'+filename.replace(/[^a-z0-9.\-_]/gi,'_');
  const res=await fetch(SUPABASE_URL+'/storage/v1/object/'+BUCKET+'/'+name,{method:'POST',headers:{'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'image/gif','x-upsert':'true'},body:blob});
  if(!res.ok){const t=await res.text();hideProgress();showErr('upload failed: '+t);return}
  const url=SUPABASE_URL+'/storage/v1/object/public/'+BUCKET+'/'+name;
  setProgress(100,'done~!');setTimeout(hideProgress,800);
  addCard(url,name);saveLocal(url,name)
}
function addCard(url,name){
  const e=document.getElementById('empty');if(e)e.remove();
  const short=name.replace(/^\d+_/,'');
  const card=document.createElement('div');card.className='card';
  card.innerHTML='<img src="'+url+'" alt="'+short+'" loading="lazy"/><div class="card-foot"><span class="card-name" title="'+short+'">'+short+'</span><button class="copy-btn" onclick="copyUrl(\''+url+'\',this)">copy</button></div>';
  grid.prepend(card)
}
function copyUrl(url,btn){navigator.clipboard.writeText(url).then(()=>{btn.textContent='copied!';btn.classList.add('ok');setTimeout(()=>{btn.textContent='copy';btn.classList.remove('ok')},1800)})}
function saveLocal(url,name){const items=JSON.parse(localStorage.getItem('gifs_uploads')||'[]');items.unshift({url,name});localStorage.setItem('gifs_uploads',JSON.stringify(items.slice(0,200)))}
(function(){const items=JSON.parse(localStorage.getItem('gifs_uploads')||'[]');if(items.length){const e=document.getElementById('empty');if(e)e.remove();items.forEach(({url,name})=>addCard(url,name))}})();
</script>
</body>
</html>
