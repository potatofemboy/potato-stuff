<body>

<script>

function Q(d){const f=new Map();for(let i=0;i<d.length;i+=4){const k=(d[i]<<16)|(d[i+1]<<8)|d[i+2];f.set(k,(f.get(k)||0)+1)}const e=[];for(const[k,c]of f)e.push([(k>>16)&255,(k>>8)&255,k&255,c]);function sp(b,d){if(d===0||b.length===0){let r=0,g=0,bl=0,t=0;for(const p of b){r+=p[0]*p[3];g+=p[1]*p[3];bl+=p[2]*p[3];t+=p[3]}return t?[[r/t|0,g/t|0,bl/t|0]]:[[0,0,0]]}let rm=255,rx=0,gm=255,gx=0,bm=255,bx=0;for(const p of b){rm=Math.min(rm,p[0]);rx=Math.max(rx,p[0]);gm=Math.min(gm,p[1]);gx=Math.max(gx,p[1]);bm=Math.min(bm,p[2]);bx=Math.max(bx,p[2])}const rr=rx-rm,gr=gx-gm,br=bx-bm,ch=rr>=gr&&rr>=br?0:gr>=br?1:2;b.sort((a,b)=>a[ch]-b[ch]);let t=0;for(const p of b)t+=p[3];let h=0,m=1;for(let i=0;i<b.length;i++){h+=b[i][3];if(h*2>=t){m=i+1;break}}return[...sp(b.slice(0,m),d-1),...sp(b.slice(m),d-1)]}const p=sp(e,8);while(p.length<256)p.push([0,0,0]);return p}
function E(fr,w,h){const b=[];const wb=n=>b.push(n&255),ws=n=>{wb(n);wb(n>>8)},wt=s=>{for(let i=0;i<s.length;i++)wb(s.charCodeAt(i))};wt('GIF89a');ws(w);ws(h);wb(0xF7);wb(0);wb(0);const pal=Q(fr[0].data);for(let i=0;i<256;i++){wb(pal[i][0]);wb(pal[i][1]);wb(pal[i][2])}if(fr.length>1)wt('\x21\xFF\x0BNETSCAPE2.0\x03\x01\x00\x00\x00');fr.forEach(f=>{wb(0x21);wb(0xF9);wb(4);wb(0);ws(fr.length>1?8:0);wb(0);wb(0);wb(0x2C);ws(0);ws(0);ws(w);ws(h);wb(0);const idx=new Uint8Array(w*h),ca=new Map();for(let i=0;i<w*h;i++){const r=f.data[i*4],g=f.data[i*4+1],bl=f.data[i*4+2],ck=(r<<16)|(g<<8)|bl;let bst=ca.get(ck);if(bst===undefined){let bd=1e9;for(let j=0;j<256;j++){const dr=r-pal[j][0],dg=g-pal[j][1],db=bl-pal[j][2],dist=dr*dr+dg*dg+db*db;if(dist<bd){bd=dist;bst=j}}ca.set(ck,bst)}idx[i]=bst}wb(8);let c=256,e=257,nc=258,cs=9,o=[],cur=0,nb=0;const fl=(v,b)=>{cur|=v<<nb;nb+=b;while(nb>=8){o.push(cur&255);cur>>>=8;nb-=8}};fl(c,cs);let t=new Map();for(let i=0;i<256;i++)t.set(String.fromCharCode(i),i);let bf=String.fromCharCode(idx[0]);for(let i=1;i<idx.length;i++){let ch=String.fromCharCode(idx[i]),nx=bf+ch;if(t.has(nx))bf=nx;else{fl(t.get(bf),cs);if(nc<4096){t.set(nx,nc++);if(nc>(1<<cs)&&cs<12)cs++}else{fl(c,cs);cs=9;nc=258;t.clear();for(let j=0;j<256;j++)t.set(String.fromCharCode(j),j)}bf=ch}}fl(t.get(bf),cs);fl(e,cs);if(nb>0)o.push(cur&255);for(let i=0;i<o.length;i+=255){const ck=o.slice(i,i+255);wb(ck.length);for(let j=0;j<ck.length;j++)wb(ck[j])}wb(0)});wb(0x3B);return new Uint8Array(b)}
async function H(f){
  _PW.style.display='block';_PL.textContent='processing...';_PF.style.width='0%';
  const MAX=480,c=document.createElement('canvas'),x=c.getContext('2d');let fr=[];
  if(f.type.startsWith('video/')){
    _PL.textContent='loading video...';
    const vid=document.createElement('video');
    vid.muted=true;vid.playsInline=true;
    await new Promise((res,rej)=>{vid.onloadeddata=res;vid.onerror=()=>rej(new Error('video load failed'));vid.src=URL.createObjectURL(f);vid.load()});
    const sc=Math.min(1,MAX/Math.max(vid.videoWidth||320,vid.videoHeight||240));
    c.width=Math.round((vid.videoWidth||320)*sc)||320;c.height=Math.round((vid.videoHeight||240)*sc)||240;
    const dur=isFinite(vid.duration)&&vid.duration>0?Math.min(vid.duration,10):1;
    const NF=20;
    for(let k=0;k<NF;k++){
      await new Promise(res=>{const t=setTimeout(res,600);vid.onseeked=()=>{clearTimeout(t);res()};vid.currentTime=k===0?0:(k/(NF-1))*dur});
      x.drawImage(vid,0,0,c.width,c.height);
      fr.push(x.getImageData(0,0,c.width,c.height));
      _PF.style.width=(k/NF*75)+'%';
    }
  } else {
    _PL.textContent='reading image...';
    const img=await new Promise((res,rej)=>{const m=new Image();m.onload=()=>res(m);m.onerror=rej;m.src=URL.createObjectURL(f)});
    const sc=Math.min(1,MAX/Math.max(img.width,img.height));
    c.width=Math.round(img.width*sc)||MAX;c.height=Math.round(img.height*sc)||MAX;
    x.drawImage(img,0,0,c.width,c.height);
    fr.push(x.getImageData(0,0,c.width,c.height));
    _PF.style.width='60%';
  }
  _PL.textContent='encoding gif...';
  const g=E(fr,c.width,c.height);
  _PL.textContent='uploading...';_PF.style.width='85%';
  const n=UID+'_'+Date.now()+'.gif';
  const r=await fetch(SU+'/storage/v1/object/'+BN+'/'+n,{method:'POST',headers:{'Authorization':'Bearer '+SK,'Content-Type':'image/gif'},body:new Blob([g],{type:'image/gif'})});

    const dbr=await fetch(SU+'/rest/v1/public_gifs',{method:'POST',headers:{'Authorization':'Bearer '+SK,'apikey':SK,'Content-Type':'application/json','Prefer':'return=representation,resolution=merge-duplicates'},body:JSON.stringify({u,n,p:true,o:UID})});

}
(async()=>{

})();
