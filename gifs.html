*{box-sizing:border-box;margin:0;padding:0}body{background:#09090f;color:#f0eef8;font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}body::before{content:'';position:fixed;top:-200px;left:-150px;width:500px;height:500px;background:radial-gradient(circle,rgba(244,114,182,.07) 0%,transparent 70%);pointer-events:none;z-index:0}body::after{content:'';position:fixed;bottom:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(192,132,252,.06) 0%,transparent 70%);pointer-events:none;z-index:0}.page{max-width:760px;margin:0 auto;padding:3rem 1.5rem 6rem;position:relative;z-index:1}h1{font-size:2.4rem;font-weight:600;letter-spacing:-0.05em;background:linear-gradient(120deg,#f9a8d4,#f472b6,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block;transform:rotate(-1deg);transform-origin:left;margin-bottom:.15rem}.sub{color:#7a7890;font-size:.86rem;margin-bottom:2rem;padding-left:2px}.drop{border:1.5px dashed rgba(244,114,182,.4);border-radius:16px;background:#111118;padding:2.5rem 1.5rem;display:flex;flex-direction:column;align-items:center;gap:.55rem;cursor:pointer;transition:all .2s;text-align:center;position:relative}.drop:hover,.drop.over{border-color:#f472b6;background:rgba(244,114,182,.04)}.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}.drop svg{opacity:.6;margin-bottom:.1rem}.drop-title{font-size:.95rem;font-weight:500}.drop-sub{font-size:.78rem;color:#7a7890;line-height:1.6}.pills{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin-top:.35rem}.pill{font-size:.68rem;font-family:'DM Mono',monospace;background:#1a1a24;border:1px solid rgba(244,114,182,.12);border-radius:99px;padding:2px 8px;color:#7a7890}.url-row{display:flex;gap:.6rem;margin-top:.9rem}.url-row input{flex:1;background:#111118;border:1px solid rgba(244,114,182,.12);border-radius:9px;padding:.58rem .85rem;color:#f0eef8;font-family:'DM Sans',sans-serif;font-size:.86rem;outline:none;transition:border .2s}.url-row input:focus{border-color:#f472b6}.url-row input::placeholder{color:#7a7890}.btn{background:#f472b6;color:#fff;border:none;border-radius:9px;padding:.58rem 1.1rem;font-family:'DM Sans',sans-serif;font-size:.86rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}.btn:hover{background:#be185d}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}.prog-wrap{margin-top:1.1rem;display:none}.prog-label{font-size:.76rem;color:#7a7890;margin-bottom:.38rem}.prog-bar{height:3px;background:#1a1a24;border-radius:99px;overflow:hidden}.prog-fill{height:100%;background:#f472b6;border-radius:99px;width:0%;transition:width .3s}.err{margin-top:.8rem;background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.25);border-radius:99px;padding:.6rem .85rem;font-size:.8rem;color:#fca5a5;display:none}.gallery{margin-top:2.75rem}.g-head{font-size:.74rem;font-weight:500;color:#7a7890;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:.7rem}.empty{color:#7a7890;font-size:.86rem;padding:.5rem 0}.card{background:#111118;border:1px solid rgba(244,114,182,.12);border-radius:12px;overflow:hidden;transition:border .18s}.card:hover{border-color:rgba(244,114,182,.35)}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#000}.card-foot{padding:.55rem .7rem;display:flex;align-items:center;gap:.45rem}.card-name{flex:1;font-size:.68rem;font-family:'DM Mono',monospace;color:#7a7890;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy-btn{background:#1a1a24;border:1px solid rgba(244,114,182,.35);color:#f0eef8;border-radius:6px;padding:.28rem .6rem;font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}.copy-btn:hover{border-color:#f472b6;color:#f472 <body>
<div class="page">

<script>

const _d=document,_dr=_d.getElementById('drop'),_fi=_d.getElementById('file-input'),_ui=_d.getElementById('url-input'),_ub=_d.getElementById('url-btn'),_pw=_d.getElementById('prog-wrap'),_pl=_d.getElementById('prog-label'),_pf=_d.getElementById('prog-fill'),_eb=_d.getElementById('err'),_gr=_d.getElementById('grid');
_dr.addEventListener('dragover',e=>{e.preventDefault();_dr.classList.add('over')});_dr.addEventListener('dragleave',()=>_dr.classList.remove('over'));_dr.addEventListener('drop',e=>{e.preventDefault();_dr.classList.remove('over');const f=e.dataTransfer.files[0];if(f)h_f(f)});
_fi.addEventListener('change',()=>{if(_fi.files[0])h_f(_fi.files[0]);_fi.value=''});_ub.addEventListener('click',()=>{const u=_ui.value.trim();if(u)h_u(u)});

function s_p(p,l){_pw.style.display='block';_pl.textContent=l||'encoding...';_pf.style.width=p+'%'}
function h_p(){_pw.style.display='none';_pf.style.width='0%'}
function s_e(m){_eb.style.display='block';_eb.textContent=m}

function q_8(d){const f=new Map();for(let i=0;i<d.length;i+=4){const k=(d[i]<<16)|(d[i+1]<<8)|d[i+2];f.set(k,(f.get(k)||0)+1)}const e=[];for(const[k,c]of f)e.push([(k>>16)&255,(k>>8)&255,k&255,c]);function sp(b,d){if(d===0||b.length===0){let r=0,g=0,bl=0,t=0;for(const p of b){r+=p[0]*p[3];g+=p[1]*p[3];bl+=p[2]*p[3];t+=p[3]}if(!t)return[[0,0,0]];return[[r/t|0,g/t|0,bl/t|0]]}let rmin=255,rmax=0,gmin=255,gmax=0,bmin=255,bmax=0;for(const p of b){if(p[0]<rmin)rmin=p[0];if(p[0]>rmax)rmax=p[0];if(p[1]<gmin)gmin=p[1];if(p[1]>gmax)gmax=p[1];if(p[2]<bmin)bmin=p[2];if(p[2]>bmax)bmax=p[2]}const rr=rmax-rmin,gr=gmax-gmin,br=bmax-bmin;const ch=rr>=gr&&rr>=br?0:gr>=br?1:2;b.sort((a,b)=>a[ch]-b[ch]);let t=0;for(const p of b)t+=p[3];let h=0,m=1;for(let i=0;i<b.length;i++){h+=b[i][3];if(h*2>=t){m=i+1;break}}m=Math.max(1,Math.min(m,b.length-1));return[...sp(b.slice(0,m),d-1),...sp(b.slice(m),d-1)]}const p=sp(e,8);while(p.length<256)p.push([0,0,0]);return p}

function e_g(f,w,h,d){const b=[];const wb=n=>b.push(n&255),ws=n=>{wb(n);wb(n>>8)},wt=s=>{for(let i=0;i<s.length;i++)wb(s.charCodeAt(i))};wt('GIF89a');ws(w);ws(h);wb(0xF7);wb(0);wb(0);const p0=q_8(f[0].data);for(let i=0;i<256;i++){wb(p0[i][0]);wb(p0[i][1]);wb(p0[i][2])}wt('\x21\xFF\x0BNETSCAPE2.0\x03\x01\x00\x00\x00');f.forEach((fr,fi)=>{const p=fi===0?p0:q_8(fr.data);wb(0x21);wb(0xF9);wb(4);wb(0);ws(d/10);wb(0);wb(0);wb(0x2C);ws(0);ws(0);ws(w);ws(h);wb(0x80|7);for(let i=0;i<256;i++){wb(p[i][0]);wb(p[i][1]);wb(p[i][2])}const idx=new Uint8Array(w*h),buf=new Int16Array(w*h*3),ca=new Map();for(let i=0;i<w*h;i++){buf[i*3]=fr.data[i*4];buf[i*3+1]=fr.data[i*4+1];buf[i*3+2]=fr.data[i*4+2]}for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,r=buf[i*3],g=buf[i*3+1],bl=buf[i*3+2],ck=((r&255)<<16)|((g&255)<<8)|(bl&255);let bst=ca.get(ck);if(bst===undefined){let bd=1e9;for(let j=0;j<256;j++){const dr=r-p[j][0],dg=g-p[j][1],db=bl-p[j][2],dist=dr*dr+dg*dg+db*db;if(dist<bd){bd=dist;bst=j}}ca.set(ck,bst)}idx[i]=bst;const er=r-p[bst][0],eg=g-p[bst][1],eb=bl-p[bst][2];if(x+1<w){buf[(i+1)*3]+=er*7/16;buf[(i+1)*3+1]+=eg*7/16;buf[(i+1)*3+2]+=eb*7/16}if(y+1<h){if(x>0){buf[(i+w-1)*3]+=er*3/16;buf[(i+w-1)*3+1]+=eg*3/16;buf[(i+w-1)*3+2]+=eb*3/16}buf[(i+w)*3]+=er*5/16;buf[(i+w)*3+1]+=eg*5/16;buf[(i+w)*3+2]+=eb*5/16;if(x+1<w){buf[(i+w+1)*3]+=er/16;buf[(i+w+1)*3+1]+=eg/16;buf[(i+w+1)*3+2]+=eb/16}}}wb(8);let c=1<<8,e=c+1,nc=e+1,cs=9,o=[],cur=0,nb=0;const fl=(v,b)=>{cur|=v<<nb;nb+=b;while(nb>=8){o.push(cur&255);cur>>>=8;nb-=8}};fl(c,cs);let t=new Map();for(let i=0;i<c;i++)t.set(String.fromCharCode(i),i);let bf=String.fromCharCode(idx[0]);for(let i=1;i<idx.length;i++){let ch=String.fromCharCode(idx[i]),nx=bf+ch;if(t.has(nx))bf=nx;else{fl(t.get(bf),cs);if(nc<4096){t.set(nx,nc++);if(nc>(1<<cs)&&cs<12)cs++}else{fl(c,cs);cs=9;nc=e+1;t.clear();for(let j=0;j<c;j++)t.set(String.fromCharCode(j),j)}bf=ch}}fl(t.get(bf),cs);fl(e,cs);if(nb>0)o.push(cur&255);for(let i=0;i<o.length;i+=255){const ck=o.slice(i,i+255);wb(ck.length);for(let j=0;j<ck.length;j++)wb(ck[j])}wb(0)});wb(0x3B);return new Uint8Array(b)}

async function h_f(f){_eb.style.display='none';const t=f.type;if(t.startsWith('image/')){s_p(20,'sampling image...');const i=await new Promise((r,j)=>{const img=new Image();img.onload=()=>r(img);img.src=URL.createObjectURL(f)});const s=Math.min(1,800/Math.max(i.width,i.height)),w=Math.round(i.width*s),h=Math.round(i.height*s);const c=_d.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(i,0,0,w,h);s_p(60,'optimizing palette...');const g=e_g([x.getImageData(0,0,w,h)],w,h,100);await u_g(new Blob([g],{type:'image/gif'}),f.name.split('.')[0]+'.gif')}else if(t.startsWith('video/')){s_p(10,'processing video frames...');const v=_d.createElement('video');v.src=URL.createObjectURL(f);await v.play();const s=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight)),w=Math.round(v.videoWidth*s),h=Math.round(v.videoHeight*s),c=_d.createElement('canvas'),x=c.getContext('2d'),fr=[];c.width=w;c.height=h;x.imageSmoothingQuality='high';for(let i=0;i<30;i++){v.currentTime=i*0.1;await new Promise(r=>v.onseeked=r);x.drawImage(v,0,0,w,h);fr.push(x.getImageData(0,0,w,h));s_p(10+(i*2),'capturing frame '+i)}const g=e_g(fr,w,h,10);await u_g(new Blob([g],{type:'image/gif'}),'video.gif')}else s_e('invalid file')}

async function u_g(b,n){s_p(90,'finalizing...');const id=Date.now()+'_'+n;const r=await fetch(S_U+'/storage/v1/object/'+B_N+'/'+id,{method:'POST',headers:{'Authorization':'Bearer '+S_K,'Content-Type':'image/gif'},body:b});if(!r.ok)return s_e('upload failed');const u=S_U+'/storage/v1/object/public/'+B_N+'/'+id;s_p(100,'done!');setTimeout(h_p,1000);a_c(u,id);const l=JSON.parse(localStorage.getItem('g_u')||'[]');l.unshift({u,id});localStorage.setItem('g_u',JSON.stringify(l.slice(0,50)))}
function a_c(u,n){const e=_d.getElementById('empty');if(e)e.remove();const c=_d.createElement('div');c.className='card';c.innerHTML=`<img src="${u}" loading="lazy"/><div class="card-foot"><span class="card-name">${n}</span><button class="copy-btn" onclick="cp('${u}',this)">link</button></div>`;_gr.prepend(c)}
function cp(u,b){navigator.clipboard.writeText(u);b.textContent='copied';setTimeout(()=>b.textContent='link',2000)}
(function(){const l=JSON.parse(localStorage.getItem('g_u')||'[]');l.forEach(i=>a_c(i.u,i.id))})();
</script>
